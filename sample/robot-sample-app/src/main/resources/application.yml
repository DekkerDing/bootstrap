spring:
  application:
    name: robot-sample-app

  # H2 内存数据库配置 / H2 in-memory database configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA 配置 / JPA configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# 客服机器人 Starter 配置 / Customer Robot Starter configuration
customer-robot:
  enabled: true
  persistence:
    type: jpa
  modules:
    customer:
      enabled: true
    conversation:
      enabled: true
    message:
      enabled: true
    session:
      enabled: true
  api:
    basePath: /api

# 日志配置 / Logging configuration
logging:
  level:
    io.github.DekkerDing: DEBUG
