plugins {
    id 'java'
}

dependencies {
    // MapStruct 依赖，用于对象映射
    // MapStruct dependency for object mapping
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    compileOnly 'org.mapstruct:mapstruct:1.5.3.Final'

    // Validation API 依赖
    // Validation API dependency
    compileOnly 'javax.validation:validation-api:2.0.1.Final'

    // Spring Boot 相关依赖（从父项目继承）
    // Spring Boot related dependencies (inherited from parent project)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Web / Spring Web (from Framework)
    compileOnly 'io.github.DekkerDing:framework-web:1.0-SNAPSHOT'

    // Spring Data JPA / Spring Data JPA
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MyBatis / MyBatis (using stub annotations provided in project)
    // compileOnly 'org.mybatis:mybatis'
    // compileOnly 'org.mybatis.spring:mybatis-spring'

    // Spring Transaction / Spring Transaction (from Framework)
    compileOnly 'io.github.DekkerDing:framework-transaction:1.0-SNAPSHOT'

    // 测试依赖 / Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
